<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雲端聯絡簿 — 原型</title>
<style>
  :root {
    --paper: #F7F1DF;
    --paper-line: #DED4B4;
    --ink: #2B2B3D;
    --ink-soft: #5B5A6E;
    --stamp-red: #C1443C;
    --stamp-red-soft: #E9C9C6;
    --spine-green: #3F6E52;
    --spine-green-light: #4F8563;
    --sage: #8FA688;
    --muted: #8A8577;
    --card-bg: #FFFDF6;
    --shadow: 0 2px 0 rgba(43,43,61,0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", -apple-system, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.45), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,255,255,0.3), transparent 45%),
      repeating-linear-gradient(100deg, #C9B98A 0px, #C9B98A 2px, #CDBD8E 2px, #CDBD8E 4px),
      linear-gradient(160deg, #D9CFA8, #C7B98D);
    min-height: 100vh;
    color: var(--ink);
    position: relative;
  }

  .desk-deco {
    position: fixed;
    pointer-events: none;
    opacity: 0.85;
    z-index: 0;
  }
  @media (max-width: 900px) { .desk-deco { display: none; } }

  .app {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 230px 1fr;
    max-width: 1100px;
    margin: 44px auto;
    min-height: 680px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow:
      0 1px 0 #fff,
      0 26px 50px rgba(43,43,61,0.28),
      0 6px 16px rgba(43,43,61,0.14);
    animation: appIn 0.4s cubic-bezier(.2,.8,.3,1) both;
  }

  @keyframes appIn {
    from { opacity: 0; transform: translateY(14px) scale(0.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .app::before,
  .app::after {
    content: "";
    position: absolute;
    left: 10px;
    right: 10px;
    background: var(--paper);
    border-radius: 10px;
    z-index: -1;
  }
  .app::before { bottom: -8px; height: 20px; box-shadow: 0 6px 10px rgba(43,43,61,0.12); }
  .app::after { bottom: -14px; left: 22px; right: 22px; height: 20px; opacity: 0.6; }

  @media (max-width: 780px) {
    .app { grid-template-columns: 1fr; margin: 0; box-shadow: none; }
    .spine { flex-direction: row; overflow-x: auto; padding: 16px; }
    .spine-dates { flex-direction: row; }
  }

  /* ---------- 書背 / 側欄 ---------- */
  .spine {
    background: linear-gradient(165deg, var(--spine-green-light) 0%, var(--spine-green) 55%, #2E5A40 100%);
    color: #F4EFDD;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    position: relative;
  }

  .spine::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0; right: 0;
    width: 6px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.22), rgba(0,0,0,0.05) 40%, rgba(0,0,0,0.22));
  }

  .spine-badge {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(244,239,221,0.15);
    border: 1.5px solid rgba(244,239,221,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin-bottom: 4px;
  }

  .spine-title {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: 0.03em;
    line-height: 1.4;
    text-shadow: 0 1px 0 rgba(255,255,255,0.18), 0 2px 4px rgba(0,0,0,0.25);
  }

  .spine-sub {
    font-size: 12.5px;
    color: #CFE0D2;
    margin-top: 4px;
  }

  .role-toggle {
    display: flex;
    background: rgba(0,0,0,0.18);
    border-radius: 8px;
    padding: 3px;
    gap: 3px;
  }

  .role-toggle button {
    flex: 1;
    border: none;
    background: transparent;
    color: #DDE8DD;
    padding: 8px 6px;
    font-size: 13px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease;
  }

  .role-toggle button.active {
    background: var(--paper);
    color: var(--spine-green);
    font-weight: 700;
  }

  .spine-section-label {
    font-size: 12px;
    color: #B9D2BE;
    text-transform: none;
    border-top: 1px solid rgba(244,239,221,0.2);
    padding-top: 16px;
  }

  .spine-dates {
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow-y: auto;
  }

  .spine-date-btn {
    text-align: left;
    background: transparent;
    border: none;
    color: #E4EEE3;
    padding: 9px 10px;
    border-radius: 6px;
    font-size: 13.5px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .spine-date-btn:hover { background: var(--spine-green-light); }
  .spine-date-btn.selected { background: var(--paper); color: var(--spine-green); font-weight: 700; }

  .spine-date-btn .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--stamp-red);
    flex-shrink: 0;
    margin-left: 6px;
  }

  /* ---------- 主頁面(格線紙) ---------- */
  .page {
    background:
      repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 33px,
        var(--paper-line) 34px
      ),
      var(--paper);
    padding: 36px 44px 60px 56px;
    overflow-y: auto;
    max-height: 90vh;
    position: relative;
  }

  .page::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: 26px;
    background-image: radial-gradient(circle, #D9CFA8 4px, transparent 4.5px);
    background-size: 26px 34px;
    background-position: 13px 17px;
    box-shadow: inset -2px 0 4px rgba(43,43,61,0.06);
  }

  .page::after {
    content: "";
    position: absolute;
    top: 0; right: 0;
    width: 0; height: 0;
    border-style: solid;
    border-width: 0 34px 34px 0;
    border-color: transparent #EDE4C4 transparent transparent;
    filter: drop-shadow(-2px 2px 2px rgba(43,43,61,0.12));
  }

  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 22px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .page-header h1 {
    font-size: 21px;
    margin: 0;
    font-weight: 700;
  }

  .page-header .today {
    font-size: 13px;
    color: var(--ink-soft);
  }

  /* ---------- 教師輸入卡 ---------- */
  .entry-form {
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    padding: 22px 24px;
    margin-bottom: 28px;
    box-shadow: var(--shadow);
  }

  .entry-form label {
    display: block;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 6px;
    margin-top: 16px;
  }

  .entry-form label:first-of-type { margin-top: 0; }

  .entry-form input[type="date"],
  .entry-form textarea {
    width: 100%;
    border: 1px solid var(--paper-line);
    background: #fff;
    border-radius: 4px;
    padding: 9px 10px;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
  }

  .entry-form textarea { resize: vertical; min-height: 54px; }

  .hw-list { display: flex; flex-direction: column; gap: 8px; }

  .hw-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .hw-row input[type="text"] {
    flex: 1;
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 14px;
  }

  .hw-row button.remove {
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 4px 8px;
  }
  .hw-row button.remove:hover { color: var(--stamp-red); }

  .add-hw-btn {
    align-self: flex-start;
    border: 1px dashed var(--sage);
    background: none;
    color: var(--spine-green);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    margin-top: 8px;
    font-family: inherit;
  }
  .add-hw-btn:hover { background: #EFF4EC; }

  .form-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 20px;
    gap: 10px;
  }

  .btn-stamp {
    background: var(--stamp-red);
    color: #FFF6F0;
    border: none;
    padding: 11px 22px;
    border-radius: 24px;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 3px 0 #9B342D;
    transition: transform 0.12s ease;
  }
  .btn-stamp:hover { transform: translateY(-1px); }
  .btn-stamp:active { transform: translateY(1px); box-shadow: 0 1px 0 #9B342D; }
  .btn-stamp.stamped { animation: stampPress 0.35s ease; }

  @keyframes stampPress {
    0% { transform: scale(1); }
    35% { transform: scale(0.9) rotate(-4deg); }
    60% { transform: scale(1.06) rotate(2deg); }
    100% { transform: scale(1) rotate(0); }
  }

  /* ---------- 條目卡(共用) ---------- */
  .entries { display: flex; flex-direction: column; gap: 18px; }

  .entry-card {
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-radius: 6px;
    padding: 20px 22px;
    position: relative;
    box-shadow: var(--shadow), 0 6px 14px rgba(43,43,61,0.06);
    animation: cardIn 0.25s ease both;
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  .entry-card:hover {
    box-shadow: var(--shadow), 0 10px 20px rgba(43,43,61,0.1);
    transform: translateY(-1px);
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .entry-card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .entry-date {
    font-size: 15px;
    font-weight: 700;
  }

  .entry-weekday {
    font-size: 12px;
    color: var(--muted);
    margin-left: 6px;
    font-weight: 400;
  }

  .stamp {
    width: 52px;
    height: 52px;
    border: 2.5px solid var(--stamp-red);
    border-radius: 50%;
    color: var(--stamp-red);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    transform: rotate(-8deg);
    flex-shrink: 0;
    text-align: center;
    line-height: 1.2;
    position: relative;
    box-shadow: 0 0 0 3px rgba(193,68,60,0.12);
  }
  .stamp::before {
    content: "";
    position: absolute;
    inset: 4px;
    border: 1px solid var(--stamp-red);
    border-radius: 50%;
    opacity: 0.55;
  }

  .section-title {
    font-size: 12px;
    color: var(--muted);
    margin: 14px 0 6px;
  }
  .section-title:first-of-type { margin-top: 0; }

  .hw-view-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .hw-view-list li {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14.5px;
  }

  .hw-view-list li::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 1px;
    background: var(--sage);
    flex-shrink: 0;
  }

  .announcement-text {
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--ink);
    white-space: pre-wrap;
  }

  .ack-row {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--paper-line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .ack-btn {
    border: 1px solid var(--sage);
    background: #fff;
    color: var(--spine-green);
    padding: 7px 16px;
    border-radius: 18px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }

  .ack-btn.done {
    background: #EAF1E7;
    border-color: var(--spine-green);
    cursor: default;
  }

  .ack-status {
    font-size: 12.5px;
    color: var(--muted);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 14px;
  }

  .monitor-stats {
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    padding: 14px 20px;
    margin-bottom: 20px;
    font-size: 13.5px;
    color: var(--ink-soft);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .monitor-stats strong { color: var(--spine-green); font-size: 15px; }

  /* ---------- 登入畫面 ---------- */
  .login-overlay {
    position: fixed;
    inset: 0;
    background: #EDE6D0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }

  .login-card {
    background: var(--card-bg);
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    padding: 38px 32px 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 24px 60px rgba(43,43,61,0.28), 0 6px 16px rgba(43,43,61,0.12);
    position: relative;
    overflow: hidden;
    animation: cardIn 0.3s ease both;
  }
  .login-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--spine-green), var(--stamp-red));
  }

  .login-card h2 {
    margin: 0 0 4px;
    font-size: 19px;
  }
  .login-card .login-sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 22px;
  }

  .login-role-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
  }

  .login-role-btn {
    text-align: left;
    border: 1.5px solid var(--paper-line);
    background: #fff;
    padding: 11px 14px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 10px;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .login-role-btn:hover { transform: translateX(2px); }
  .login-role-btn .role-icon {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: #F1ECD8;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }
  .login-role-btn.selected .role-icon { background: var(--spine-green); color: #fff; }
  .login-role-btn.selected {
    border-color: var(--spine-green);
    background: #EAF1E7;
    font-weight: 700;
    color: var(--spine-green);
  }

  .login-card label {
    display: block;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  .login-card input[type="password"] {
    width: 100%;
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 0.1em;
  }

  .login-error {
    color: var(--stamp-red);
    font-size: 12.5px;
    margin-top: 8px;
    min-height: 16px;
  }

  .login-submit {
    width: 100%;
    margin-top: 18px;
    background: var(--stamp-red);
    color: #FFF6F0;
    border: none;
    padding: 11px;
    border-radius: 24px;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 3px 0 #9B342D;
  }

  .logout-btn {
    background: none;
    border: 1px solid rgba(244,239,221,0.4);
    color: #E4EEE3;
    padding: 6px 12px;
    border-radius: 16px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    align-self: flex-start;
  }

  /* ---------- 圖片上傳 ---------- */
  .upload-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1.5px dashed var(--sage);
    background: #F5F8F3;
    color: var(--spine-green);
    padding: 9px 16px;
    border-radius: 20px;
    font-size: 13.5px;
    cursor: pointer;
    font-family: inherit;
  }
  .upload-btn:hover { background: #EAF1E7; }
  .upload-btn input[type="file"] {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0; overflow: hidden;
  }

  .image-thumb-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 12px;
  }

  .image-thumb {
    position: relative;
    width: 74px;
    height: 74px;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--paper-line);
  }
  .image-thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .image-thumb .remove-img {
    position: absolute;
    top: 2px; right: 2px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(43,43,61,0.65);
    color: #fff;
    border: none;
    font-size: 12px;
    line-height: 20px;
    text-align: center;
    cursor: pointer;
    padding: 0;
  }

  .entry-images-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 4px;
  }

  .entry-image-thumb {
    width: 84px;
    height: 84px;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--paper-line);
    cursor: zoom-in;
    flex-shrink: 0;
  }
  .entry-image-thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.15s ease;
  }
  .entry-image-thumb:hover img { transform: scale(1.06); }

  .img-lightbox {
    position: fixed;
    inset: 0;
    background: rgba(20,18,15,0.86);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
    cursor: zoom-out;
  }
  .img-lightbox.open { display: flex; }
  .img-lightbox img {
    max-width: 100%;
    max-height: 90vh;
    border-radius: 6px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

<!-- 桌面裝飾插畫(僅寬螢幕顯示) -->
<svg class="desk-deco" style="top:60px; left:4%; width:70px;" viewBox="0 0 100 100">
  <g transform="rotate(-25 50 50)">
    <rect x="42" y="10" width="16" height="65" rx="2" fill="#F2C94C" stroke="#2B2B3D" stroke-width="2"/>
    <polygon points="42,75 58,75 50,92" fill="#E8B084" stroke="#2B2B3D" stroke-width="2"/>
    <rect x="42" y="10" width="16" height="10" fill="#DE8F6E" stroke="#2B2B3D" stroke-width="2"/>
  </g>
</svg>

<svg class="desk-deco" style="top:140px; right:5%; width:60px;" viewBox="0 0 100 100">
  <path d="M30 20 Q10 20 10 45 Q10 70 35 70 Q55 70 55 50 L55 25 Q55 12 43 12 Q31 12 31 25 L31 60"
    fill="none" stroke="#8A8577" stroke-width="6" stroke-linecap="round"/>
</svg>

<svg class="desk-deco" style="bottom:70px; left:6%; width:46px;" viewBox="0 0 100 100">
  <path d="M50 5 L61 38 L96 38 L67 58 L78 91 L50 71 L22 91 L33 58 L4 38 L39 38 Z"
    fill="#C1443C" opacity="0.85"/>
</svg>

<svg class="desk-deco" style="bottom:110px; right:6%; width:64px;" viewBox="0 0 100 100">
  <ellipse cx="50" cy="80" rx="26" ry="8" fill="#8A8577" opacity="0.5"/>
  <path d="M50 78 C30 78 26 55 30 40 C34 25 66 25 70 40 C74 55 70 78 50 78 Z" fill="#4F8563" stroke="#2B2B3D" stroke-width="2"/>
  <path d="M50 40 L50 15" stroke="#3F6E52" stroke-width="4" stroke-linecap="round"/>
</svg>

<div class="login-overlay" id="login-overlay">
  <div class="login-card">
    <h2>七年5班聯絡簿</h2>
    <div class="login-sub">請選擇身份並輸入密碼登入</div>

    <div class="login-role-group" id="login-role-group">
      <button type="button" class="login-role-btn selected" data-role="teacher"><span class="role-icon">👩‍🏫</span>施老師</button>
      <button type="button" class="login-role-btn" data-role="monitor"><span class="role-icon">🎗️</span>班長</button>
      <button type="button" class="login-role-btn" data-role="parent"><span class="role-icon">👪</span>家長 / 學生</button>
    </div>

    <label id="login-password-label">密碼</label>
    <input type="password" id="login-password" placeholder="請輸入密碼" autocomplete="off">
    <div class="login-error" id="login-error"></div>

    <button class="login-submit" id="login-submit">登入</button>
  </div>
</div>

<div class="img-lightbox" id="img-lightbox">
  <img id="img-lightbox-img" src="" alt="附加圖片放大檢視">
</div>

<div class="app">
  <aside class="spine">
    <div>
      <div class="spine-badge">📘</div>
      <div class="spine-title">七年5班<br>聯絡簿</div>
      <div class="spine-sub" id="spine-role-label">施老師 · 2026 學年度</div>
    </div>

    <button class="logout-btn" id="logout-btn">登出</button>
    <button class="logout-btn" id="refresh-btn">🔄 重新整理</button>

    <div>
      <div class="spine-section-label">歷史紀錄</div>
      <div class="spine-dates" id="spine-dates"></div>
    </div>
  </aside>

  <main class="page">
    <div class="page-header">
      <h1 id="page-title">今日聯絡事項</h1>
      <div class="today" id="page-today"></div>
    </div>

    <div id="teacher-form-wrap"></div>
    <div class="entries" id="entries-wrap"></div>
  </main>
</div>

<script>
(async function () {
  const todayISO = new Date().toISOString().slice(0, 10);
  const weekdayNames = ["日","一","二","三","四","五","六"];

  function fmtWeekday(iso) {
    const d = new Date(iso + "T00:00:00");
    return "週" + weekdayNames[d.getDay()];
  }
  function fmtDate(iso) {
    const [y,m,dd] = iso.split("-");
    return `${y}/${m}/${dd}`;
  }

  const VALID_PASSWORD = "705115";
  const ROLE_LABELS = {
    teacher: "施老師 · 2026 學年度",
    monitor: "班長登入 · 2026 學年度",
    parent: "家長 / 學生 · 2026 學年度"
  };

  let state = {
    role: null,
    selectedDate: todayISO,
    entries: [],
    draft: {
      date: todayISO,
      homework: [""],
      announcement: "",
      images: []
    }
  };

  function shiftDate(iso, days) {
    const d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0,10);
  }

  // ---------- 雲端同步(所有人共用同一份資料) ----------
  const STORAGE_KEY = "seven-five-contact-book-entries";
  let syncFailed = false;

  async function loadEntriesFromCloud() {
    try {
      const res = await window.storage.get(STORAGE_KEY, true);
      if (res && res.value) return JSON.parse(res.value);
      return [];
    } catch (err) {
      return [];
    }
  }

  async function saveEntriesToCloud() {
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(state.entries), true);
      syncFailed = false;
    } catch (err) {
      syncFailed = true;
      console.error("聯絡簿同步失敗", err);
    }
    renderSyncBanner();
  }

  function renderSyncBanner() {
    let banner = document.getElementById("sync-banner");
    if (syncFailed) {
      if (!banner) {
        banner = document.createElement("div");
        banner.id = "sync-banner";
        banner.style.cssText = "background:#F8DFC0;color:#7A4A17;padding:8px 16px;border-radius:6px;font-size:12.5px;margin-bottom:16px;";
        banner.textContent = "⚠️ 目前無法連上雲端,這則內容可能只存在你這台裝置上,請稍後再試一次。";
        const page = document.querySelector(".page");
        page.insertBefore(banner, page.firstChild.nextSibling);
      }
    } else if (banner) {
      banner.remove();
    }
  }

  function compressImage(dataUrl, callback) {
    const img = new Image();
    img.onload = () => {
      const maxDim = 900;
      let width = img.width, height = img.height;
      if (width > maxDim || height > maxDim) {
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      callback(canvas.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = () => callback(dataUrl);
    img.src = dataUrl;
  }

  function findEntry(date) {
    return state.entries.find(e => e.date === date);
  }

  function render() {
    document.getElementById("page-today").textContent = fmtDate(todayISO) + "（" + fmtWeekday(todayISO) + "）";

    document.getElementById("spine-role-label").textContent = ROLE_LABELS[state.role] || "";
    document.getElementById("page-title").textContent =
      (state.role === "teacher" || state.role === "monitor") ? "登打今日聯絡事項" : "聯絡簿內容";

    renderSpineDates();
    renderTeacherForm();
    renderMonitorStats();
    renderEntries();
  }

  function renderMonitorStats() {
    const existing = document.getElementById("monitor-stats-wrap");
    if (existing) existing.remove();
    if (state.role !== "monitor") return;

    const total = state.entries.length;
    const read = state.entries.filter(e => e.ack).length;

    const div = document.createElement("div");
    div.id = "monitor-stats-wrap";
    div.className = "monitor-stats";
    div.innerHTML = `<span>📊 全班家長已讀進度</span><strong>${read} / ${total} 則已讀</strong>`;

    const entriesWrap = document.getElementById("entries-wrap");
    entriesWrap.parentNode.insertBefore(div, entriesWrap);
  }

  function renderSpineDates() {
    const wrap = document.getElementById("spine-dates");
    const allDates = Array.from(new Set(
      [todayISO, ...state.entries.map(e => e.date)]
    )).sort((a,b) => b.localeCompare(a));

    wrap.innerHTML = "";
    allDates.forEach(date => {
      const btn = document.createElement("button");
      btn.className = "spine-date-btn" + (date === state.selectedDate ? " selected" : "");
      const hasEntry = !!findEntry(date);
      btn.innerHTML = `<span>${fmtDate(date)}（${fmtWeekday(date)}）${date === todayISO ? " · 今天" : ""}</span>` +
        (hasEntry ? '<span class="dot"></span>' : '');
      btn.onclick = () => { state.selectedDate = date; render(); };
      wrap.appendChild(btn);
    });
  }

  function renderTeacherForm() {
    const wrap = document.getElementById("teacher-form-wrap");
    if (state.role !== "teacher" && state.role !== "monitor") { wrap.innerHTML = ""; return; }

    wrap.innerHTML = `
      <div class="entry-form">
        <label>日期</label>
        <input type="date" id="draft-date" value="${state.draft.date}">

        <label>📚 回家作業</label>
        <div class="hw-list" id="draft-hw-list"></div>
        <button type="button" class="add-hw-btn" id="add-hw-btn">＋ 新增一項作業</button>

        <label>📢 聯絡事項 / 公告</label>
        <textarea id="draft-announcement" placeholder="例如：明天請帶美術用具、班費繳交提醒⋯⋯">${state.draft.announcement}</textarea>

        <label>📷 附加照片(選填,可從相簿選取或直接拍照)</label>
        <label class="upload-btn">
          ＋ 選擇圖片
          <input type="file" id="draft-image-input" accept="image/*" multiple>
        </label>
        <div class="image-thumb-row" id="draft-image-thumbs"></div>

        <div class="form-actions">
          <button class="btn-stamp" id="publish-btn">🖋️ 蓋章送出</button>
        </div>
      </div>
    `;

    const hwList = document.getElementById("draft-hw-list");
    hwList.innerHTML = "";
    state.draft.homework.forEach((val, i) => {
      const row = document.createElement("div");
      row.className = "hw-row";
      row.innerHTML = `
        <input type="text" data-idx="${i}" value="${escapeAttr(val)}" placeholder="輸入作業項目">
        <button type="button" class="remove" data-idx="${i}" title="刪除">✕</button>
      `;
      hwList.appendChild(row);
    });

    hwList.querySelectorAll('input[type="text"]').forEach(inp => {
      inp.oninput = (e) => {
        state.draft.homework[+e.target.dataset.idx] = e.target.value;
      };
    });
    hwList.querySelectorAll('button.remove').forEach(btn => {
      btn.onclick = (e) => {
        const idx = +e.target.dataset.idx;
        state.draft.homework.splice(idx, 1);
        if (state.draft.homework.length === 0) state.draft.homework.push("");
        render();
      };
    });

    document.getElementById("add-hw-btn").onclick = () => {
      state.draft.homework.push("");
      render();
    };

    document.getElementById("draft-date").onchange = (e) => {
      state.draft.date = e.target.value;
    };

    document.getElementById("draft-announcement").oninput = (e) => {
      state.draft.announcement = e.target.value;
    };

    renderDraftImageThumbs();

    document.getElementById("draft-image-input").onchange = (e) => {
      const files = Array.from(e.target.files || []);
      files.forEach(file => {
        if (!file.type.startsWith("image/")) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          compressImage(ev.target.result, (compressed) => {
            state.draft.images.push(compressed);
            renderDraftImageThumbs();
          });
        };
        reader.readAsDataURL(file);
      });
      e.target.value = "";
    };

    document.getElementById("publish-btn").onclick = (e) => {
      const btn = e.currentTarget;
      btn.classList.add("stamped");
      btn.disabled = true;

      setTimeout(() => {
        const cleanHw = state.draft.homework.map(s => s.trim()).filter(Boolean);
        const existing = findEntry(state.draft.date);
        const newEntry = {
          date: state.draft.date,
          homework: cleanHw,
          announcement: state.draft.announcement.trim(),
          published: true,
          ack: existing ? existing.ack : false,
          postedBy: state.role,
          images: state.draft.images.slice()
        };
        if (existing) {
          Object.assign(existing, newEntry);
        } else {
          state.entries.push(newEntry);
        }
        state.selectedDate = state.draft.date;
        state.draft = { date: todayISO, homework: [""], announcement: "", images: [] };
        render();
        saveEntriesToCloud();
      }, 320);
    };
  }

  function renderDraftImageThumbs() {
    const wrap = document.getElementById("draft-image-thumbs");
    if (!wrap) return;
    wrap.innerHTML = "";
    state.draft.images.forEach((src, i) => {
      const thumb = document.createElement("div");
      thumb.className = "image-thumb";
      thumb.innerHTML = `<img src="${src}" alt="附加圖片預覽"><button type="button" class="remove-img" data-idx="${i}">✕</button>`;
      wrap.appendChild(thumb);
    });
    wrap.querySelectorAll(".remove-img").forEach(btn => {
      btn.onclick = () => {
        state.draft.images.splice(+btn.dataset.idx, 1);
        renderDraftImageThumbs();
      };
    });
  }

  function renderEntries() {
    const wrap = document.getElementById("entries-wrap");
    const sorted = [...state.entries].sort((a,b) => b.date.localeCompare(a.date));

    if (sorted.length === 0) {
      wrap.innerHTML = `<div class="empty-state">還沒有任何聯絡簿紀錄。</div>`;
      return;
    }

    wrap.innerHTML = "";
    sorted.forEach(entry => {
      const card = document.createElement("div");
      card.className = "entry-card";

      let hwHtml = "";
      if (entry.homework.length > 0) {
        hwHtml = `
          <div class="section-title">📚 回家作業</div>
          <ul class="hw-view-list">
            ${entry.homework.map(h => `<li>${escapeHtml(h)}</li>`).join("")}
          </ul>
        `;
      }

      let annHtml = "";
      if (entry.announcement) {
        annHtml = `
          <div class="section-title">📢 聯絡事項</div>
          <div class="announcement-text">${escapeHtml(entry.announcement)}</div>
        `;
      }

      let imgHtml = "";
      if (entry.images && entry.images.length > 0) {
        imgHtml = `
          <div class="section-title">🖼️ 附加照片</div>
          <div class="entry-images-grid">
            ${entry.images.map((src, i) => `<div class="entry-image-thumb" data-src="${src}"><img src="${src}" alt="附加照片 ${i+1}"></div>`).join("")}
          </div>
        `;
      }

      let ackHtml = "";
      if (state.role === "parent") {
        ackHtml = `
          <div class="ack-row">
            <span class="ack-status">${entry.ack ? "家長已閱讀" : "尚未確認閱讀"}</span>
            <button class="ack-btn ${entry.ack ? "done" : ""}" data-date="${entry.date}">
              ${entry.ack ? "✓ 已讀" : "標記已讀"}
            </button>
          </div>
        `;
      } else {
        ackHtml = `
          <div class="ack-row">
            <span class="ack-status">${entry.ack ? "家長已讀" : "家長尚未讀取"}</span>
          </div>
        `;
      }

      const stampLabel = entry.postedBy === "monitor" ? "班長<br>確認" : "施老師<br>確認";

      card.innerHTML = `
        <div class="entry-card-head">
          <div><span class="entry-date">${fmtDate(entry.date)}</span><span class="entry-weekday">${fmtWeekday(entry.date)}</span></div>
          <div class="stamp">${stampLabel}</div>
        </div>
        ${hwHtml}
        ${annHtml}
        ${imgHtml}
        ${ackHtml}
      `;

      wrap.appendChild(card);

      card.querySelectorAll(".entry-image-thumb").forEach(thumb => {
        thumb.onclick = () => openLightbox(thumb.dataset.src);
      });

      if (state.role === "parent") {
        const ackBtn = card.querySelector(".ack-btn");
        if (ackBtn && !entry.ack) {
          ackBtn.onclick = () => {
            entry.ack = true;
            render();
            saveEntriesToCloud();
          };
        }
      }
    });
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }
  function escapeAttr(str) { return escapeHtml(str); }

  const lightbox = document.getElementById("img-lightbox");
  const lightboxImg = document.getElementById("img-lightbox-img");
  function openLightbox(src) {
    lightboxImg.src = src;
    lightbox.classList.add("open");
  }
  lightbox.onclick = () => {
    lightbox.classList.remove("open");
    lightboxImg.src = "";
  };

  // ---------- 登入邏輯 ----------
  let selectedLoginRole = "teacher";
  const loginOverlay = document.getElementById("login-overlay");
  const loginRoleGroup = document.getElementById("login-role-group");
  const loginPasswordInput = document.getElementById("login-password");
  const loginError = document.getElementById("login-error");

  loginRoleGroup.querySelectorAll(".login-role-btn").forEach(btn => {
    btn.onclick = () => {
      selectedLoginRole = btn.dataset.role;
      loginRoleGroup.querySelectorAll(".login-role-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      loginError.textContent = "";
      updateLoginFormForRole();
    };
  });

  function updateLoginFormForRole() {
    const label = document.getElementById("login-password-label");
    const needsPassword = selectedLoginRole !== "parent";
    label.style.display = needsPassword ? "block" : "none";
    loginPasswordInput.style.display = needsPassword ? "block" : "none";
    loginPasswordInput.value = "";
    document.getElementById("login-submit").textContent =
      needsPassword ? "登入" : "進入聯絡簿";
  }

  async function attemptLogin() {
    if (selectedLoginRole === "parent") {
      state.role = "parent";
      loginOverlay.style.display = "none";
      state.entries = await loadEntriesFromCloud();
      render();
      return;
    }
    if (loginPasswordInput.value.trim() === VALID_PASSWORD) {
      state.role = selectedLoginRole;
      loginOverlay.style.display = "none";
      loginPasswordInput.value = "";
      loginError.textContent = "";
      state.entries = await loadEntriesFromCloud();
      render();
    } else {
      loginError.textContent = "密碼錯誤，請再試一次。";
    }
  }

  document.getElementById("login-submit").onclick = attemptLogin;
  loginPasswordInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") attemptLogin();
  });

  document.getElementById("logout-btn").onclick = () => {
    state.role = null;
    loginOverlay.style.display = "flex";
    selectedLoginRole = "teacher";
    loginRoleGroup.querySelectorAll(".login-role-btn").forEach(b =>
      b.classList.toggle("selected", b.dataset.role === "teacher")
    );
    updateLoginFormForRole();
  };

  document.getElementById("refresh-btn").onclick = async () => {
    state.entries = await loadEntriesFromCloud();
    render();
  };

  state.entries = await loadEntriesFromCloud();
  updateLoginFormForRole();
  render();
})();
</script>

</body>
</html>
